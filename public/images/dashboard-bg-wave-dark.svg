<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- ลายคลื่นเวอร์ชัน "โหมดกลางคืน" (2026-09-11 — ตามคำขอผู้ใช้ที่อยากมีสวิตช์สลับโหมดกลางคืนไว้ถนอมสายตา)

       เส้นโค้งทั้ง 8 เส้นและมุมหมุน -35 องศา คัดลอกมาจาก dashboard-bg-wave.svg ทุกตัวอักษร ไม่ได้ขยับพิกัด
       ใดๆ เลยแม้แต่จุดเดียว — ลายที่เห็นจึงเป็นลายเดียวกันเป๊ะกับโหมดกลางวัน ต่างกันแค่ชุดสี ทำให้ตอนกด
       สวิตช์สลับธีม ผู้ใช้เห็นเป็น "จอเดิมที่หรี่ไฟลง" ไม่ใช่ "เปลี่ยนไปอีกหน้าหนึ่ง"

       ชุดสี: พลัมเข้มอมชมพู ไล่จาก #33212c มุมซ้ายบน ไป #170e14 มุมขวาล่าง (ทิศทางเดียวกับกลางวันคือ
       สว่างซ้ายบน → เข้มขวาล่าง) เลือกคุมโทนให้ยังเห็นเป็นสีชมพูอมม่วงจางๆ ไม่ใช่เทาดำ เพื่อให้ยังรู้สึก
       เป็นธีมชมพูเดียวกัน — และตั้งใจไม่ใช้ดำสนิท (#000000) เลยแม้แต่แถบเดียว เพราะพื้นดำสนิทกับตัวหนังสือ
       สว่างคือคู่ที่คอนทราสต์สูงสุด ซึ่งทำให้ตาล้าที่สุดเวลาอ่านจอในที่มืด (ตรงข้ามกับที่ผู้ใช้ขอ)

       หมายเหตุ: ไม่ได้ใช้วิธี filter: brightness() กดภาพกลางวันให้มืดลง เพราะการลดความสว่างทั้งภาพทำให้
       สีชมพูกลายเป็นเทาหม่น เสียความเป็นชมพูไปหมด จึงวาดชุดสีใหม่แยกเป็นไฟล์นี้แทน -->
  <g transform="rotate(-35 960 540)">
    <rect x="-1500" y="-1500" width="5000" height="5000" fill="#33212c" />
    <path d="M -1500,-860 C -700,-1020 200,-720 1000,-880 C 1800,-1030 2600,-700 3500,-860 L 3500,3500 L -1500,3500 Z" fill="#301f29" />
    <path d="M -1500,-520 C -700,-360 200,-680 1000,-500 C 1800,-340 2600,-660 3500,-510 L 3500,3500 L -1500,3500 Z" fill="#2c1c26" />
    <path d="M -1500,-180 C -700,-330 200,-30 1000,-190 C 1800,-350 2600,-20 3500,-170 L 3500,3500 L -1500,3500 Z" fill="#291a23" />
    <path d="M -1500,150 C -700,10 200,300 1000,145 C 1800,0 2600,320 3500,160 L 3500,3500 L -1500,3500 Z" fill="#251820" />
    <path d="M -1500,490 C -700,640 200,340 1000,495 C 1800,660 2600,320 3500,485 L 3500,3500 L -1500,3500 Z" fill="#21161d" />
    <path d="M -1500,830 C -700,680 200,980 1000,825 C 1800,660 2600,1000 3500,835 L 3500,3500 L -1500,3500 Z" fill="#1e131a" />
    <path d="M -1500,1170 C -700,1330 200,1010 1000,1175 C 1800,1350 2600,990 3500,1160 L 3500,3500 L -1500,3500 Z" fill="#1a1017" />
    <path d="M -1500,1520 C -700,1370 200,1670 1000,1515 C 1800,1350 2600,1690 3500,1525 L 3500,3500 L -1500,3500 Z" fill="#170e14" />
  </g>
</svg>
