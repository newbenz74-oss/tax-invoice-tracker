<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Layered diagonal wave bands: crisp bezier curves, no blur, no stroke/highlight on the seams —
       โครงเส้นโค้งทั้ง 8 เส้นเป็นชุดเดิมทุกประการ ไม่ได้ขยับพิกัดใดๆ เลย (ผู้ใช้พอใจกับลายนี้อยู่แล้ว
       ตั้งแต่รอบ 6 ของธีมฟ้า) เปลี่ยนเฉพาะ "สี" ของแต่ละแถบ

       (2026-09-11 — เปลี่ยนธีมทั้งระบบเป็นชมพูพาสเทล ตามคำขอผู้ใช้) เดิมไล่จากฟ้าสดใส #4a9bf7 มุมซ้ายบน
       ไปกรมท่าเกือบดำ #050f38 มุมขวาล่าง — ผู้ใช้ขอเปลี่ยนเป็นชมพู แล้วเลือกเฉดเองจากตัวอย่างที่เสนอไป
       โดยระบุชัดเจนว่าเอาเฉพาะ 3 เฉดนี้กับสีขาวเท่านั้น ไม่เอาโทนเข้มเลย:
         #ffe0ec  #ffcde0  #ffb9d3  + #ffffff
       จึงไล่เฉด 9 แถบด้วยการ interpolate เชิงเส้นระหว่าง 4 สีนั้น (ขาวมุมซ้ายบน → ชมพูเข้มสุดของพาเลต
       #ffb9d3 มุมขวาล่าง) ทำให้ทุกค่าสีที่ปรากฏบนจอ "อยู่ในช่วงที่ผู้ใช้เลือกไว้เป๊ะ" ไม่มีสีเข้มหลุดเข้ามา

       ผลข้างเคียงที่ต้องรู้: พื้นหลังอ่อนทั้งผืนแบบนี้ทำให้การ์ดกระจก "เข้ม" + ตัวหนังสือสว่างของธีมเดิม
       อ่านไม่ออกทันที จึงต้องพลิกธีมทั้งระบบเป็นการ์ดขาว + ตัวหนังสือเข้มควบคู่กันไปด้วยเสมอ (ดู
       app/globals.css — ทำไปพร้อมกันในรอบเดียวกันนี้แล้ว) ถ้าจะย้อนกลับไปธีมเข้มต้องย้อนทั้งสองไฟล์คู่กัน -->
  <g transform="rotate(-35 960 540)">
    <rect x="-1500" y="-1500" width="5000" height="5000" fill="#ffffff" />
    <path d="M -1500,-860 C -700,-1020 200,-720 1000,-880 C 1800,-1030 2600,-700 3500,-860 L 3500,3500 L -1500,3500 Z" fill="#fff3f8" />
    <path d="M -1500,-520 C -700,-360 200,-680 1000,-500 C 1800,-340 2600,-660 3500,-510 L 3500,3500 L -1500,3500 Z" fill="#ffe8f1" />
    <path d="M -1500,-180 C -700,-330 200,-30 1000,-190 C 1800,-350 2600,-20 3500,-170 L 3500,3500 L -1500,3500 Z" fill="#ffdeea" />
    <path d="M -1500,150 C -700,10 200,300 1000,145 C 1800,0 2600,320 3500,160 L 3500,3500 L -1500,3500 Z" fill="#ffd6e6" />
    <path d="M -1500,490 C -700,640 200,340 1000,495 C 1800,660 2600,320 3500,485 L 3500,3500 L -1500,3500 Z" fill="#ffcfe2" />
    <path d="M -1500,830 C -700,680 200,980 1000,825 C 1800,660 2600,1000 3500,835 L 3500,3500 L -1500,3500 Z" fill="#ffc8dd" />
    <path d="M -1500,1170 C -700,1330 200,1010 1000,1175 C 1800,1350 2600,990 3500,1160 L 3500,3500 L -1500,3500 Z" fill="#ffc0d8" />
    <path d="M -1500,1520 C -700,1370 200,1670 1000,1515 C 1800,1350 2600,1690 3500,1525 L 3500,3500 L -1500,3500 Z" fill="#ffb9d3" />
  </g>
</svg>
